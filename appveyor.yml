branches:
  # whitelist
  only:
    - master
    
image: Visual Studio 2019

stack: python 3.11

before_build:
  # --- .NET setup ---
  - nuget restore src/MyAlbum.Single.sln
  - choco install opencover.portable -y
  - choco install codecov -y

  # --- Python setup for FastAPI ---
  - cmd: python --version
  - cmd: python -m pip install --upgrade pip
build: off

build_script:
  # --- .NET build ---
  - msbuild src\MyAlbum.Single.sln /verbosity:minimal
  
  # --- FastAPI AI service build / sanity check ---
  - cmd: |
      cd services\AI-service
      pip install -r requirements.txt
      python -c "import app.main; print('FastAPI AI service import OK')"
test_script:
  # --- .NET tests + coverage ---
  - OpenCover.Console.exe -register:NhatTanVu -target:"C:/Program Files/dotnet/dotnet.exe" -targetargs:"test src/MyAlbum.Single.sln" -filter:"+[WebSPA]MyAlbum.Persistence.*Repository +[WebSPA]MyAlbum.Core.*Storage +[WebSPA]MyAlbum.Core.*Service +[WebSPA]MyAlbum.WebSPA.Controllers.*Controller -[Tests*]* -[WebSPA]*OidcConfigurationController" -output:".\WebSPA_coverage.xml" -oldstyle
  - codecov -f "WebSPA_coverage.xml" -t a921bbb2-9b19-4e86-8c1f-00109359f2bc -cF dotnet

  # --- Python tests + coverage ---
  - cmd: |
      cd %APPVEYOR_BUILD_FOLDER%\services\AI-service
      pytest --cov=app --cov-report=xml
  - codecov -f "%APPVEYOR_BUILD_FOLDER%\services\AI-service\coverage.xml" -t a921bbb2-9b19-4e86-8c1f-00109359f2bc -cF python