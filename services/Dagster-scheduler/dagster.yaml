run_storage:
  module: dagster_postgres.run_storage
  class: PostgresRunStorage
  config:
    postgres_db:
      hostname: 
        env: DAGSTER_DB_HOST
      username: 
        env: DAGSTER_DB_USER
      password: 
        env: DAGSTER_DB_PASSWORD
      db_name: 
        env: DAGSTER_DB_NAME
      port: 5432

