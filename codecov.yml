coverage:
  status:
    project:
      default:
        # 🔵 Keep existing .NET behavior unchanged
        target: auto
        threshold: 0%

      python-api:
        # 🟢 Python-only coverage rule
        paths:
          - "services/AI-service/app/api/**"

    patch:
      python-api:
        paths:
          - "services/AI-service/app/api/**"
